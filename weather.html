<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>实时天气查询</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: url('ChatGPT Image 2026年5月8日 19_42_10.png') no-repeat center center fixed;
            background-size: cover;
            padding: 20px;
        }

        .weather-card {
            background: white;
            padding: 35px 30px;
            border-radius: 24px;
            box-shadow: 0 25px 80px rgba(0, 0, 0, 0.3);
            text-align: center;
            width: 100%;
            max-width: 420px;
        }

        h2 {
            font-size: 24px;
            margin-bottom: 8px;
            color: #333;
        }

        .subtitle {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .input-group {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
        }

        .city-input {
            flex: 1;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            transition: border-color 0.3s;
        }

        .city-input:focus {
            border-color: #667eea;
        }

        .btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 15px;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .btn:hover {
            background: #5a6fd6;
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #555;
            margin-top: 10px;
            font-size: 13px;
            padding: 10px 18px;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .suggestions {
            background: #f8f9fa;
            border-radius: 12px;
            margin-bottom: 15px;
            padding: 10px;
            text-align: left;
            max-height: 250px;
            overflow-y: auto;
            display: none;
        }

        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            border-radius: 8px;
            transition: background 0.2s;
            border-bottom: 1px solid #eee;
        }

        .suggestion-item:last-child {
            border-bottom: none;
        }

        .suggestion-item:hover {
            background: #e9ecef;
        }

        .suggestion-item .name {
            font-weight: 600;
            color: #333;
            font-size: 15px;
        }

        .suggestion-item .detail {
            color: #888;
            font-size: 12px;
            margin-top: 3px;
        }

        .temp {
            font-size: 72px;
            font-weight: 300;
            color: #333;
            margin: 15px 0;
            line-height: 1;
        }

        .desc {
            font-size: 22px;
            color: #555;
            margin-bottom: 8px;
        }

        .location-tag {
            display: inline-block;
            background: #f0f4ff;
            color: #667eea;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 14px;
            margin-bottom: 15px;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 20px;
        }

        .detail-item {
            background: #f8f9fa;
            padding: 12px;
            border-radius: 12px;
            font-size: 13px;
            color: #666;
        }

        .detail-item .label {
            color: #999;
            font-size: 11px;
            margin-bottom: 4px;
        }

        .detail-item .value {
            color: #333;
            font-size: 16px;
            font-weight: 600;
        }

        .loading {
            color: #999;
            padding: 20px;
        }

        .error {
            color: #e74c3c;
            padding: 15px;
            font-size: 14px;
        }

        .locate-btn {
            background: #48bb78;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 13px;
            margin-bottom: 12px;
        }

        .locate-btn:hover {
            background: #38a169;
        }
    </style>
</head>

<body>
    <div class="weather-card">
        <h2>实时天气查询</h2>
        <p class="subtitle">支持全国任意城市、区县、街道</p>

        <button class="locate-btn" onclick="autoLocate()">自动定位当前位置</button>

        <div class="input-group">
            <input type="text" class="city-input" id="cityInput" placeholder="输入城市或区县，如：深圳龙岗区" value="">
            <button class="btn" onclick="searchCity()">查询</button>
        </div>

        <div class="suggestions" id="suggestions"></div>

        <div id="result">
            <p class="loading">点击"自动定位"或输入城市查询</p>
        </div>
    </div>

    <script>
        function getWeatherInfo(code) {
            const map = {
                0: { text: '晴朗', icon: '☀️' },
                1: { text: '主要晴朗', icon: '🌤️' },
                2: { text: '多云', icon: '⛅' },
                3: { text: '阴天', icon: '☁️' },
                45: { text: '雾', icon: '🌫️' },
                48: { text: '雾凇', icon: '🌫️' },
                51: { text: '毛毛雨', icon: '🌦️' },
                53: { text: '中度毛毛雨', icon: '🌦️' },
                55: { text: '大毛毛雨', icon: '🌧️' },
                61: { text: '小雨', icon: '🌧️' },
                63: { text: '中雨', icon: '🌧️' },
                65: { text: '大雨', icon: '🌧️' },
                71: { text: '小雪', icon: '🌨️' },
                73: { text: '中雪', icon: '🌨️' },
                75: { text: '大雪', icon: '❄️' },
                80: { text: '阵雨', icon: '🌦️' },
                81: { text: '强阵雨', icon: '🌧️' },
                82: { text: '暴雨', icon: '⛈️' },
                95: { text: '雷雨', icon: '⛈️' },
                96: { text: '雷雨伴冰雹', icon: '⛈️' },
                99: { text: '强雷雨伴冰雹', icon: '⛈️' }
            };
            return map[code] || { text: '未知', icon: '❓' };
        }

        async function searchCity() {
            const city = document.getElementById('cityInput').value.trim();
            const resultDiv = document.getElementById('result');
            const sugDiv = document.getElementById('suggestions');

            if (!city) {
                resultDiv.innerHTML = '<p class="error">请输入城市名</p>';
                return;
            }

            resultDiv.innerHTML = '<p class="loading">正在搜索...</p>';
            sugDiv.style.display = 'none';

            try {
                const response = await fetch(
                    `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(city)}&accept-language=zh-CN&limit=8&countrycodes=cn`,
                    { headers: { 'User-Agent': 'WeatherApp/1.0 (personal use)' } }
                );
                const data = await response.json();

                if (!data || data.length === 0) {
                    resultDiv.innerHTML = '<p class="error">未找到该地点，试试输入"深圳市龙岗区"或"湖南衡阳"</p>';
                    return;
                }

                let html = '';
                data.forEach((place) => {
                    const name = place.display_name.split(',')[0];
                    const detail = place.display_name;
                    html += `
                        <div class="suggestion-item" onclick="selectCity(${place.lat}, ${place.lon}, '${name.replace(/'/g, "\\'")}')">
                            <div class="name">${name}</div>
                            <div class="detail">${detail}</div>
                        </div>
                    `;
                });

                sugDiv.innerHTML = html;
                sugDiv.style.display = 'block';
                resultDiv.innerHTML = '<p style="color:#667eea; font-size:14px;">👆 请点击上方列表选择具体位置</p>';

            } catch (error) {
                resultDiv.innerHTML = '<p class="error">搜索失败，请检查网络</p>';
                console.error(error);
            }
        }

        async function selectCity(lat, lon, name) {
            document.getElementById('suggestions').style.display = 'none';
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<p class="loading">正在获取天气...</p>';

            try {
                const response = await fetch(
                    `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true`
                );
                const data = await response.json();
                const current = data.current_weather;
                const info = getWeatherInfo(current.weathercode);

                resultDiv.innerHTML = `
                    <div class="location-tag">${name}</div>
                    <div class="desc">${info.icon} ${info.text}</div>
                    <div class="temp">${current.temperature}°</div>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <div class="label">风速</div>
                            <div class="value">${current.windspeed} km/h</div>
                        </div>
                        <div class="detail-item">
                            <div class="label">风向</div>
                            <div class="value">${current.winddirection}°</div>
                        </div>
                        <div class="detail-item">
                            <div class="label">坐标</div>
                            <div class="value">${Number(lat).toFixed(2)}, ${Number(lon).toFixed(2)}</div>
                        </div>
                        <div class="detail-item">
                            <div class="label">更新</div>
                            <div class="value">${new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div>
                        </div>
                    </div>
                `;

            } catch (error) {
                resultDiv.innerHTML = '<p class="error">获取天气失败</p>';
                console.error(error);
            }
        }

        function autoLocate() {
            const resultDiv = document.getElementById('result');
            if (!navigator.geolocation) {
                resultDiv.innerHTML = '<p class="error">您的浏览器不支持定位</p>';
                return;
            }

            resultDiv.innerHTML = '<p class="loading">正在定位...</p>';

            navigator.geolocation.getCurrentPosition(
                async (position) => {
                    const lat = position.coords.latitude;
                    const lon = position.coords.longitude;
                    try {
                        const res = await fetch(
                            `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&accept-language=zh-CN`,
                            { headers: { 'User-Agent': 'WeatherApp/1.0' } }
                        );
                        const data = await res.json();
                        const name = data.address.city || data.address.town || data.address.district || data.address.county || '当前位置';
                        const district = data.address.district || data.address.suburb || '';
                        const displayName = district ? `${name} ${district}` : name;
                        selectCity(lat, lon, displayName);
                    } catch (e) {
                        selectCity(lat, lon, '当前位置');
                    }
                },
                (error) => {
                    let msg = '定位失败';
                    if (error.code === 1) msg = '您拒绝了定位权限，请手动输入城市';
                    else if (error.code === 2) msg = '无法获取位置信息';
                    else if (error.code === 3) msg = '定位超时';
                    resultDiv.innerHTML = `<p class="error">${msg}</p>`;
                },
                { enableHighAccuracy: true, timeout: 10000, maximumAge: 0 }
            );
        }

        document.getElementById('cityInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') searchCity();
        });
    </script>
</body>

</html>
