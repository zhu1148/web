<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>性能监控</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Microsoft YaHei", -apple-system, sans-serif;
            background: url('https://zhu1148.github.io/web/ChatGPT Image 2026年5月8日 19_42_10.png') no-repeat center center fixed;
            background-size: cover;
            min-height: 100vh;
            padding: 20px;
            line-height: 1.6;
        }

        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: #333;
            padding: 10px 18px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 14px;
            text-decoration: none;
            transition: background 0.3s;
            z-index: 100;
        }

        .back-btn:hover {
            background: rgba(255, 255, 255, 0.9);
        }

        .main-container {
            max-width: 700px;
            margin: 40px auto 0;
        }

        .page-header {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 20px 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .page-header h2 {
            color: #2c3e50;
            font-size: 24px;
        }

        .perf-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 25px;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .perf-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-bottom: 16px;
        }

        .perf-item {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
            padding: 14px;
        }

        .perf-label {
            font-size: 11px;
            color: #999;
            margin-bottom: 4px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .perf-value {
            font-size: 20px;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 6px;
        }

        .perf-sub {
            font-size: 11px;
            color: #999;
            margin-top: 3px;
        }

        .perf-bar {
            height: 4px;
            background: rgba(0, 0, 0, 0.08);
            border-radius: 2px;
            overflow: hidden;
            margin-top: 6px;
        }

        .perf-fill {
            height: 100%;
            background: linear-gradient(90deg, #4a90e2, #667eea);
            border-radius: 2px;
            transition: width 1s ease;
        }

        .perf-processes {
            background: rgba(0, 0, 0, 0.04);
            border-radius: 10px;
            padding: 14px;
        }

        .proc-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 5px 0;
            border-bottom: 1px solid rgba(0, 0, 0, 0.05);
            font-size: 13px;
        }

        .proc-row:last-child {
            border-bottom: none;
        }

        .proc-name {
            color: #333;
            font-weight: 500;
        }

        .proc-stat {
            color: #999;
            font-size: 12px;
        }

        .status-indicator {
            display: inline-block;
            width: 8px;
            height: 8px;
            border-radius: 50%;
            margin-right: 6px;
        }

        .status-live {
            background: #48bb78;
            box-shadow: 0 0 6px #48bb78;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        @media (max-width: 600px) {
            .perf-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <a href="index.html" class="back-btn">← 返回主页</a>

    <div class="main-container">
        <div class="page-header">
            <h2>性能监控 <span class="status-indicator status-live" id="statusDot"></span></h2>
        </div>

        <div class="perf-card">
            <div class="perf-grid">
                <div class="perf-item" id="perfCpu">
                    <div class="perf-label">CPU 占用</div>
                    <div class="perf-value">--</div>
                    <div class="perf-bar"><div class="perf-fill" style="width:0%"></div></div>
                </div>
                <div class="perf-item" id="perfGpu">
                    <div class="perf-label">GPU</div>
                    <div class="perf-value">--</div>
                    <div class="perf-bar"><div class="perf-fill" style="width:0%"></div></div>
                </div>
                <div class="perf-item" id="perfMem">
                    <div class="perf-label">内存</div>
                    <div class="perf-value">--</div>
                    <div class="perf-bar"><div class="perf-fill" style="width:0%"></div></div>
                </div>
                <div class="perf-item" id="perfVpn">
                    <div class="perf-label">VPN 状态</div>
                    <div class="perf-value">--</div>
                </div>
            </div>
            <div class="perf-processes">
                <div class="perf-label" style="margin-bottom:8px">后台进程 Top 8</div>
                <div id="perfProcList"></div>
            </div>
        </div>
    </div>

    <script>
        const PERF_SERVER = window.location.protocol === 'file:' ? 'http://localhost:8765' : '';

        function updatePerfElement(id, value, pct) {
            const el = document.getElementById(id);
            if (!el) return;
            el.querySelector('.perf-value').textContent = value;
            const bar = el.querySelector('.perf-fill');
            if (bar && pct != null) {
                bar.style.width = Math.min(100, Math.max(0, pct)) + '%';
            }
        }

        function updateProcesses(procs) {
            const el = document.getElementById('perfProcList');
            if (!el) return;
            if (!procs || procs.length === 0) {
                el.innerHTML = '<span style="color:#999;font-size:12px">无显著后台进程</span>';
                return;
            }
            el.innerHTML = procs.map(p =>
                `<div class="proc-row"><span class="proc-name">${p.name}</span><span class="proc-stat">CPU ${p.cpu}% | MEM ${p.mem}%</span></div>`
            ).join('');
        }

        async function pollPerformance() {
            try {
                const res = await fetch(PERF_SERVER + '/api/stats');
                if (!res.ok) throw new Error('server error');
                const data = await res.json();

                document.getElementById('statusDot').classList.add('status-live');

                updatePerfElement('perfCpu', data.cpu.percent + '%', data.cpu.percent);
                updatePerfElement('perfMem',
                    data.memory.used + ' / ' + data.memory.total + ' GB',
                    data.memory.percent);

                if (data.gpu) {
                    const gpuVal = data.gpu.name;
                    const gpuLoad = data.gpu.load + '%';
                    const gpuMem = data.gpu.mem_used + ' / ' + data.gpu.mem_total + ' MB';
                    updatePerfElement('perfGpu', gpuLoad, data.gpu.load);
                    const gpuEl = document.getElementById('perfGpu');
                    const existingName = gpuEl.querySelector('.perf-sub-name');
                    const existingMem = gpuEl.querySelector('.perf-sub-mem');
                    if (!existingName) {
                        const div = document.createElement('div');
                        div.className = 'perf-sub perf-sub-name';
                        div.textContent = gpuVal;
                        gpuEl.insertBefore(div, gpuEl.querySelector('.perf-bar'));
                    } else {
                        existingName.textContent = gpuVal;
                    }
                    if (!existingMem) {
                        const div = document.createElement('div');
                        div.className = 'perf-sub perf-sub-mem';
                        div.textContent = '显存 ' + gpuMem;
                        gpuEl.insertBefore(div, gpuEl.querySelector('.perf-bar'));
                    } else {
                        existingMem.textContent = '显存 ' + gpuMem;
                    }
                } else {
                    updatePerfElement('perfGpu', '无独立显卡', 0);
                }

                const vpnEl = document.getElementById('perfVpn');
                if (data.vpn && data.vpn.active) {
                    vpnEl.querySelector('.perf-value').textContent = '已连接';
                    vpnEl.querySelector('.perf-value').style.color = '#48bb78';
                    let vpnSub = vpnEl.querySelector('.perf-sub');
                    if (!vpnSub) {
                        vpnSub = document.createElement('div');
                        vpnSub.className = 'perf-sub';
                        vpnEl.appendChild(vpnSub);
                    }
                    vpnSub.textContent = data.vpn.adapter + (data.vpn.ip ? ' | ' + data.vpn.ip : '');
                } else {
                    vpnEl.querySelector('.perf-value').textContent = '未连接';
                    vpnEl.querySelector('.perf-value').style.color = '#999';
                    const vpnSub = vpnEl.querySelector('.perf-sub');
                    if (vpnSub) vpnSub.remove();
                }

                updateProcesses(data.processes);

            } catch (e) {
                document.getElementById('statusDot').classList.remove('status-live');
                const ids = ['perfCpu', 'perfGpu', 'perfMem', 'perfVpn'];
                ids.forEach(id => {
                    const el = document.getElementById(id);
                    if (el) el.querySelector('.perf-value').textContent = '未连接';
                });
                const hint = document.getElementById('perfProcList');
                if (hint) hint.innerHTML = '<span style="color:#e74c3c;font-size:12px">请运行 python server.py 然后刷新页面</span>';
            }
        }

        pollPerformance();
        setInterval(pollPerformance, 2000);
    </script>
</body>

</html>
